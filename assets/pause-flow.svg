<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Pause concept flow</title><desc id="desc">Parents describe a moment, reflect on one question and choose a next step. Teens share a perspective, preview it and submit it to a pending queue. The two paths are separate in the current prototype.</desc><rect width="1000" height="420" rx="24" fill="#faf6ed"/><g font-family="Arial,sans-serif" fill="#184e48"><text x="44" y="55" font-size="30" font-weight="700">A little space before the next sentence.</text><text x="44" y="91" font-size="16">Pause · Concept flow, not an app screenshot</text><text x="44" y="151" font-size="19" font-weight="700">PARENT</text><text x="44" y="278" font-size="19" font-weight="700">TEEN</text></g><g fill="#e5eee7" stroke="#184e48" stroke-width="2"><rect x="44" y="169" width="270" height="62" rx="14"/><rect x="365" y="169" width="270" height="62" rx="14"/><rect x="686" y="169" width="270" height="62" rx="14"/></g><g fill="#eee5fa" stroke="#7048a0" stroke-width="2"><rect x="44" y="296" width="270" height="62" rx="14"/><rect x="365" y="296" width="270" height="62" rx="14"/><rect x="686" y="296" width="270" height="62" rx="14"/></g><g font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#233d38"><text x="179" y="207">Describe the moment</text><text x="500" y="207">Reflect on one question</text><text x="821" y="207">Choose a next step</text><text x="179" y="334">Tell your side</text><text x="500" y="334">Preview and edit</text><text x="821" y="334">Pending submission</text></g><g stroke="#184e48" stroke-width="2" fill="none"><path d="M324 200h30l-7-6m7 6-7 6"/><path d="M645 200h30l-7-6m7 6-7 6"/><path d="M324 327h30l-7-6m7 6-7 6"/><path d="M645 327h30l-7-6m7 6-7 6"/></g><text x="44" y="395" font-family="Arial,sans-serif" font-size="15" fill="#596861">Current prototype: teen submissions do not feed the parent companion.</text></svg>
